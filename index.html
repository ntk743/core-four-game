<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Core Four</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12213d;
  --blue:#125dff;
  --blue-dark:#0a3fae;
  --orange:#ff6240;
  --yellow:#ffd84d;
  --cream:#f6f0e3;
  --paper:#fffdf8;
  --soft:#eef2f6;
  --line:#d9e0e8;
  --green:#39b87f;
  --muted:#72809a;
  --shadow:0 18px 45px rgba(24,36,64,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,216,77,.28),transparent 20%),
    radial-gradient(circle at 88% 5%,rgba(18,93,255,.10),transparent 24%),
    var(--cream);
  color:var(--ink);
  font-family:"DM Sans",Inter, ui-sans-serif, -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
body::before{
  content:"";position:fixed;inset:92px 0 auto 0;height:260px;pointer-events:none;z-index:-1;opacity:.28;
  background:
    linear-gradient(145deg,transparent 0 23%,rgba(18,33,61,.09) 23.4% 24%,transparent 24.4%) 0 70px/320px 170px repeat-x,
    linear-gradient(35deg,transparent 0 34%,rgba(18,93,255,.09) 34.4% 35%,transparent 35.4%) 100px 95px/360px 150px repeat-x;
}
body::after{
  content:"▲   ▲   ▲   ▲";position:fixed;left:50%;top:120px;transform:translateX(-50%);z-index:-1;
  width:min(980px,90vw);text-align:center;color:rgba(18,33,61,.045);font-size:108px;letter-spacing:.22em;white-space:nowrap;pointer-events:none;
}
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  height:92px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:24px;
  padding:0 34px;
  border-bottom:1px solid rgba(18,33,61,.08);
  background:rgba(255,253,249,.88);
  backdrop-filter:blur(16px);
  position:sticky;top:0;z-index:20;
}
.brand{
  font-family:"Anton",Impact,"Arial Black",sans-serif;
  font-size:36px;
  letter-spacing:.045em;
  color:var(--blue);
  transform:scaleY(1.08);
  transform-origin:left center;
  text-decoration:none;
  line-height:.9;
}
.brand span{display:block;font-size:12px;letter-spacing:.22em;color:var(--ink);font-family:"DM Sans",Inter,sans-serif;font-weight:800;margin-top:8px;transform:scaleY(.93)}
.topic-mini{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)
}
.topic-mini .dot{width:8px;height:8px;border-radius:99px;background:var(--orange)}
.hud{justify-self:end;display:flex;gap:10px}
.hud-card{
  min-width:104px;
  padding:10px 14px;
  border-radius:16px;
  background:#fff;
  border:1px solid rgba(18,33,61,.08);
  box-shadow:0 6px 18px rgba(24,36,64,.06);
}
.hud-card small{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.hud-card strong{font-size:24px;line-height:1;font-weight:900;letter-spacing:-.04em}
.hud-card.score strong{color:var(--blue)}
.main{width:min(1040px,calc(100% - 36px));margin:42px auto 72px;display:grid;gap:22px}
.hero{
  text-align:center;
  padding:10px 20px 2px;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:999px;background:rgba(18,93,255,.09);color:var(--blue);
  font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase
}
.hero h1{
  max-width:850px;margin:16px auto 12px;
  font-family:"Anton",Impact,sans-serif;font-size:clamp(40px,6vw,72px);line-height:.98;letter-spacing:.005em;font-weight:400
}
.hero p{margin:0;color:var(--muted);font-size:17px;font-weight:650}
.game-card{
  background:var(--paper);
  border:1px solid rgba(18,33,61,.08);
  border-radius:30px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.accent-strip{height:10px;background:linear-gradient(90deg,var(--blue) 0 48%,var(--yellow) 48% 74%,var(--orange) 74% 100%)}
.game-inner{padding:28px}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.answer{
  position:relative;
  display:flex;align-items:center;gap:16px;
  min-height:114px;
  padding:18px 18px 18px 20px;
  border-radius:22px;
  background:var(--soft);
  border:2px solid transparent;
  transition:.18s ease;
}
.answer:hover{transform:translateY(-2px);background:#f2f5f8}
.answer:focus-within{background:#fff;border-color:var(--blue);box-shadow:0 0 0 5px rgba(18,93,255,.10);transform:translateY(-2px)}
.answer.matched{background:#eef9f4;border-color:rgba(57,184,127,.36)}
.answer.unmatched{background:#fff5f2;border-color:rgba(255,98,64,.28)}
.index{
  width:50px;height:50px;flex:0 0 auto;border-radius:16px;background:#fff;display:grid;place-items:center;
  font-weight:950;font-size:18px;color:var(--blue);box-shadow:0 5px 15px rgba(24,36,64,.08)
}
.answer input{
  width:100%;border:0;outline:0;background:transparent;color:var(--ink);
  font-size:clamp(21px,2.2vw,30px);font-weight:850;letter-spacing:-.025em;padding:0
}
.answer input::placeholder{color:#a7b0bf;font-weight:700}
.meta{position:absolute;right:16px;bottom:12px;font-size:11px;font-weight:850;color:var(--muted);opacity:0;transition:.18s}
.answer.matched .meta,.answer.unmatched .meta{opacity:1}
.answer.matched .meta{color:var(--green)}
.answer.unmatched .meta{color:var(--orange)}
.score-chip{
  min-width:56px;height:40px;padding:0 10px;border-radius:14px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:17px;font-weight:950;opacity:0;transform:scale(.9);transition:.18s
}
.answer.matched .score-chip{opacity:1;transform:scale(1)}
.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px}
.link-btn{border:0;background:transparent;color:var(--muted);font-weight:850;padding:12px 6px}
.primary{
  border:0;border-radius:18px;background:var(--blue);color:#fff;font-weight:950;font-size:18px;letter-spacing:.01em;
  padding:18px 28px;min-width:230px;box-shadow:0 12px 24px rgba(18,93,255,.22);transition:.18s
}
.primary:hover{transform:translateY(-2px);background:var(--blue-dark)}
.primary:active{transform:translateY(0)}
.helpbar{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:700
}
.helpbar span{background:rgba(255,255,255,.65);padding:8px 12px;border-radius:999px;border:1px solid rgba(18,33,61,.06)}
.results{
  margin-top:18px;border-radius:26px;background:var(--ink);color:#fff;padding:26px;display:none
}
.results.show{display:block;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.result-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(255,255,255,.13);padding-bottom:18px;margin-bottom:18px}
.result-score{font-size:64px;line-height:.85;font-weight:950;letter-spacing:-.06em}
.result-score small{font-size:18px;opacity:.55;letter-spacing:0}
.percentile{background:var(--yellow);color:var(--ink);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:950}
.result-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.result-item{background:rgba(255,255,255,.07);border-radius:16px;padding:14px}
.result-item small{display:block;opacity:.55;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.result-item strong{display:block;font-size:16px;line-height:1.2}
.result-item b{display:block;margin-top:10px;color:var(--yellow);font-size:19px}
@media (max-width:760px){
  .topbar{height:74px;padding:0 16px;grid-template-columns:1fr auto}.topic-mini{display:none}.brand{font-size:28px}.hud-card{min-width:76px;padding:8px 10px}.hud-card strong{font-size:20px}.main{margin-top:26px;width:min(100% - 20px,680px)}.hero{padding-inline:8px}.hero p{font-size:15px}.game-inner{padding:16px}.answer-grid{grid-template-columns:1fr}.answer{min-height:92px;border-radius:18px}.index{width:44px;height:44px;border-radius:14px}.actions{flex-direction:column-reverse;align-items:stretch}.primary{width:100%}.link-btn{width:100%}.result-list{grid-template-columns:1fr 1fr}.result-score{font-size:50px}}
@media (max-width:420px){.hud-card:first-child{display:none}.hero h1{font-size:40px}.answer input{font-size:22px}.result-list{grid-template-columns:1fr}}

.new-topic{
  margin:18px auto 0;
  min-width:190px;
  min-height:48px;
  padding:0 22px;
  border:2px solid var(--blue,#1769d2);
  border-radius:999px;
  background:#fff;
  color:var(--blue,#1769d2);
  font:800 13px/1 "DM Sans",system-ui,sans-serif;
  letter-spacing:.08em;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 3px 0 rgba(23,105,210,.16);
  transition:.15s ease;
}
.new-topic:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 0 rgba(23,105,210,.18);
}
.next-topic{
  width:100%;
  min-height:66px;
  margin-top:18px;
  border:0;
  border-radius:18px;
  background:var(--blue,#1769d2);
  color:white;
  font:800 20px/1 "DM Sans",system-ui,sans-serif;
  cursor:pointer;
  box-shadow:0 6px 0 #0d4d9f;
  transition:.12s ease;
}
.next-topic:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 0 #0d4d9f;
}
.next-topic:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 #0d4d9f;
}


.app-hidden{display:none!important}
.start-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  background:var(--cream,#f7f0df);
}
.start-card{
  width:min(680px,100%);
  text-align:center;
}
.start-logo{
  font-family:var(--display,"DM Sans",system-ui,sans-serif);
  font-size:clamp(52px,11vw,92px);
  line-height:.95;
  font-weight:900;
  letter-spacing:-.045em;
  color:var(--navy,#102c4c);
}
.start-tag{
  margin:12px 0 34px;
  color:#68727c;
  font-weight:700;
}
.mode-card{
  position:relative;
  width:100%;
  min-height:150px;
  margin:14px 0;
  padding:26px 78px 26px 28px;
  border:0;
  border-radius:24px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 7px 0 rgba(16,44,76,.14);
  transition:.14s ease;
}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 10px 0 rgba(16,44,76,.14)}
.mode-card:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(16,44,76,.14)}
.daily-mode{background:#1769d2;color:white}
.random-mode{background:#f5b544;color:#102c4c}
.mode-kicker{
  display:block;
  font-size:11px;
  letter-spacing:.14em;
  font-weight:900;
  opacity:.72;
  margin-bottom:8px;
}
.mode-card strong{
  display:block;
  font-size:clamp(28px,5vw,42px);
  line-height:1;
  font-weight:900;
  letter-spacing:-.025em;
}
.mode-card small{
  display:block;
  margin-top:10px;
  font-size:14px;
  font-weight:700;
  opacity:.78;
}
.mode-card b{
  position:absolute;
  right:28px;
  top:50%;
  transform:translateY(-50%);
  font-size:34px;
}
.mode-label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(23,105,210,.1);
  color:#1769d2;
  font-size:10px;
  letter-spacing:.12em;
  font-weight:900;
}
@media(max-width:600px){
  .start-screen{padding:20px 14px}
  .mode-card{min-height:138px;padding:24px 64px 24px 22px;border-radius:21px}
  .mode-card b{right:22px}
}


.daily-active #newTopic{display:none!important}


body.daily-active #newTopic,
body.daily-active .new-topic,
body.daily-active .topic-nav,
body.daily-active [data-action="next-topic-pre"]{
  display:none!important;
}

#nextTopic.random-cta{
  background:#f5b544!important;
  color:#102c4c!important;
  box-shadow:0 6px 0 #d79520!important;
}
#nextTopic.random-cta:hover{
  box-shadow:0 8px 0 #d79520!important;
}
#nextTopic.random-cta:active{
  box-shadow:0 3px 0 #d79520!important;
}


/* Mode-state navigation */
body.daily-active #newTopic{display:none!important;}
body.daily-active:not(.daily-complete) #nextTopic{display:none!important;}
body.daily-active.daily-complete #nextTopic{
  display:block!important;
  background:#f5b544!important;
  color:#102c4c!important;
  box-shadow:0 6px 0 #d79520!important;
}
body.daily-active.daily-complete #nextTopic:hover{
  box-shadow:0 8px 0 #d79520!important;
}
body.daily-active.daily-complete #nextTopic:active{
  box-shadow:0 3px 0 #d79520!important;
}

/* Pre-submit answer validation: invalid only, no score/canonical reveal */
.answer.precheck-invalid{
  border-color:#e05353!important;
  background:#fff7f7!important;
}
.answer.precheck-invalid .meta{
  color:#c63f3f!important;
}
.answer.precheck-ambiguous{
  border-color:#e7a52f!important;
  background:#fffaf0!important;
}
.answer.precheck-ambiguous .meta{
  color:#a66a00!important;
}


/* V8.11: topic is now the first gameplay headline */
#topic{
  margin-top:0!important;
}


.topic-strip,.topic-bar,.top-topic,.topic-pill{display:none!important;}





.score-line{
  display:flex;
  align-items:flex-end;
  gap:12px;
  flex-wrap:wrap;
}
#finalScore{
  line-height:.88;
}
.score-unit{
  display:inline-block;
  margin-left:10px;
  font-size:clamp(26px,4vw,44px);
  line-height:1;
  font-weight:900;
  color:rgba(255,255,255,.58);
  letter-spacing:-.03em;
  vertical-align:baseline;
  white-space:nowrap;
}


.score-line-clean{
  display:flex;
  align-items:flex-end;
  gap:14px;
  flex-wrap:nowrap;
  margin:6px 0 0;
}
.score-line-clean #finalScore{
  margin:0!important;
  padding:0!important;
  line-height:.88!important;
}
.score-unit-clean{
  display:block;
  padding-bottom:.11em;
  font-size:clamp(28px,4vw,46px);
  line-height:1;
  font-weight:900;
  color:rgba(255,255,255,.62);
  letter-spacing:-.04em;
  white-space:nowrap;
}


#homeBrand{cursor:pointer;touch-action:manipulation}
#homeBrand:focus-visible{
  outline:3px solid rgba(31,102,255,.35);
  outline-offset:6px;
  border-radius:6px;
}
#nextTopic,#newTopic{touch-action:manipulation}


#topicTitle{
  transition:opacity .15s ease, transform .15s ease;
}

</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" id="homeBrand" href="#" onclick="window.coreFourHome(event)">CORE FOUR<span>PICK YOUR DEFINITIVE FOUR</span></a>
    
    <div class="hud">
      <div class="hud-card"><small>Filled</small><strong><span id="filled">0</span>/4</strong></div>
      <div class="hud-card score"><small>Score</small><strong id="liveScore">--</strong></div>
    </div>
  </header>

  
<section id="startScreen" class="start-screen">
  <div class="start-card">
    <div class="start-logo">CORE FOUR</div>
    <p class="start-tag">Pick the four that belong.</p>

    <button id="dailyBtn" class="mode-card daily-mode">
      <span class="mode-kicker">TODAY</span>
      <strong>DAILY CHALLENGE</strong>
      <small>One topic. Same for everyone.</small>
      <b>→</b>
    </button>

    <button id="randomBtn" class="mode-card random-mode">
      <span class="mode-kicker">ENDLESS</span>
      <strong>RANDOM</strong>
      <small>Keep playing new topics.</small>
      <b>→</b>
    </button>
  </div>
</section>

<main id="gameApp" class="main app-hidden">
    <section class="hero">
      <h1 id="topicTitle">Sports GOATs</h1>
      <p>Pick the four answers you think most people would choose.</p>
    </section>

    <section class="game-card">
      <div class="accent-strip"></div>
      <div class="game-inner">
        <form id="gameForm" autocomplete="off">
          <div class="answer-grid" id="answerGrid">
            <label class="answer"><span class="index">01</span><input aria-label="First answer" placeholder="First pick" spellcheck="false"><span class="score-chip">0.0</span><span class="meta"></span></label>
            <label class="answer"><span class="index">02</span><input aria-label="Second answer" placeholder="Second pick" spellcheck="false"><span class="score-chip">0.0</span><span class="meta"></span></label>
            <label class="answer"><span class="index">03</span><input aria-label="Third answer" placeholder="Third pick" spellcheck="false"><span class="score-chip">0.0</span><span class="meta"></span></label>
            <label class="answer"><span class="index">04</span><input aria-label="Fourth answer" placeholder="Fourth pick" spellcheck="false"><span class="score-chip">0.0</span><span class="meta"></span></label>
          </div>
          <div class="actions">
            <button type="button" class="link-btn" id="newTopic" onclick="window.coreFourNextTopic(event)">↻ New topic</button>
            <button class="primary" type="submit">Score my four →</button>
          </div>
        </form>

        <section class="results" id="results" aria-live="polite">
          <div class="result-top">
            <div><small style="opacity:.55;font-weight:900;letter-spacing:.12em;text-transform:uppercase">Your score</small><div class="result-score"><div class="score-line-clean"><span id="finalScore">0.0</span><span class="score-unit-clean">/ 40</span></div></div></div>
            <div class="percentile" id="percentile">TOP 10%</div>
          </div>
          <div class="result-list" id="resultList"></div>
        </section>
      </div>
    </section>

    <div class="helpbar"><span>4 picks</span><span>Blind scoring</span><span>No repeats</span></div>
  <button type="button" id="nextTopic" class="next-topic" onclick="window.coreFourNextTopic(event)">NEXT TOPIC →</button>
</main>
</div>

let topicIndex=Math.floor(Math.random()*topics.length);
const inputs=[...document.querySelectorAll('.answer input')];
const cards=[...document.querySelectorAll('.answer')];
const submitBtn=document.querySelector('.primary');

function norm(v){
  return v.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/&/g,' and ').replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function singular(v){
  if(v.endsWith('ies') && v.length>4) return v.slice(0,-3)+'y';
  if(v.endsWith('ses') && v.length>4) return v.slice(0,-2);
  if(v.endsWith('s') && !v.endsWith('ss') && v.length>3) return v.slice(0,-1);
  return v;
}
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)d[i][0]=i; for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function current(){return topics[topicIndex]}
function indexTopic(topic){
  topic._aliases=[];
  topic.entities.forEach(([id,name,score,aliases])=>{
    const all=[name,...aliases];
    // Add first/last names only when they can later be proven unique.
    all.forEach(a=>topic._aliases.push({key:norm(a),id,name,score}));
  });
}
topics.forEach(indexTopic);

function resolve(raw){
  const q=norm(raw); if(!q) return {status:'empty'};
  const t=current(), aliases=t._aliases;
  // 1. Exact alias/canonical.
  let hits=aliases.filter(a=>a.key===q || singular(a.key)===singular(q));
  let unique=[...new Map(hits.map(h=>[h.id,h])).values()];
  if(unique.length===1)return {status:'match',...unique[0]};
  if(unique.length>1)return {status:'ambiguous',candidates:unique.slice(0,3)};
  // 2. Unique first or last name / title token.
  hits=[];
  t.entities.forEach(([id,name,score])=>{
    const toks=norm(name).split(' ');
    if(toks.includes(q))hits.push({id,name,score});
  });
  unique=[...new Map(hits.map(h=>[h.id,h])).values()];
  if(unique.length===1)return {status:'match',...unique[0]};
  if(unique.length>1)return {status:'ambiguous',candidates:unique.slice(0,3)};
  // 3. Unique prefix or contained phrase, only for meaningful input lengths.
  if(q.length>=4){
    hits=aliases.filter(a=>a.key.startsWith(q) || q.startsWith(a.key) || a.key.split(' ').some(tok=>tok===q));
    unique=[...new Map(hits.map(h=>[h.id,h])).values()];
    if(unique.length===1)return {status:'match',...unique[0]};
    if(unique.length>1)return {status:'ambiguous',candidates:unique.slice(0,3)};
  }
  // 4. Fuzzy typo matching. Require a clear single best entity.
  const threshold=q.length<=5?1:q.length<=9?2:3;
  const bestById=new Map();
  aliases.forEach(a=>{const dist=lev(q,a.key);if(dist<=threshold && (!bestById.has(a.id)||dist<bestById.get(a.id).dist))bestById.set(a.id,{...a,dist})});
  const fuzzy=[...bestById.values()].sort((a,b)=>a.dist-b.dist);
  if(fuzzy.length===1 || (fuzzy.length>1 && fuzzy[0].dist<fuzzy[1].dist))return {status:'match',...fuzzy[0],fuzzy:true};
  if(fuzzy.length>1 && fuzzy[0].dist===fuzzy[1].dist)return {status:'ambiguous',candidates:fuzzy.slice(0,3)};
  return {status:'unknown'};
}
function topFour(){return [...current().entities].sort((a,b)=>b[2]-a[2]).slice(0,4).map(([id,name,score])=>({id,name,score}))}

function perfectRawScore(){
  return topFour().reduce((sum,item)=>sum+item.score,0);
}
function normalizedScore(rawScore){
  const perfect=perfectRawScore();
  if(!perfect) return 0;
  return Math.min(40,(rawScore/perfect)*40);
}
function clearEntryFeedback(){
  cards.forEach(card=>{
    card.classList.remove('matched','unmatched','precheck-invalid','precheck-ambiguous');
    card.querySelector('.meta').textContent='';
    card.querySelector('.score-chip').textContent='0.0';
  });
}
function preValidate(index){
  const input=inputs[index];
  const card=cards[index];
  card.classList.remove('precheck-invalid','precheck-ambiguous');
  card.querySelector('.meta').textContent='';
  if(!input.value.trim()) return true;

  const r=resolve(input.value);
  if(r.status==='match') return true;

  if(r.status==='ambiguous'){
    card.classList.add('precheck-ambiguous');
    card.querySelector('.meta').textContent='Be more specific';
  }else{
    card.classList.add('precheck-invalid');
    card.querySelector('.meta').textContent='Not recognized — try another answer';
  }
  return false;
}
function refresh(){
  const filled=inputs.filter(input=>input.value.trim()).length;
  clearEntryFeedback();
  document.getElementById('filled').textContent=filled;
  document.getElementById('liveScore').textContent='--';
  submitBtn.textContent=filled===4?'Submit Four →':`Pick ${4-filled} more →`;
  return {filled};
}
function showInputIssue(index,message){
  const card=cards[index];
  card.classList.add('unmatched');
  card.querySelector('.meta').textContent=message;
  inputs[index].focus();
}
function setTopic(){
  document.getElementById('topicTitle').textContent=current().title;
  const miniTopic=document.getElementById('miniTopic');
  if(miniTopic) miniTopic.textContent=current().title;
  inputs.forEach(i=>i.value='');document.getElementById('results').classList.remove('show');document.getElementById('liveScore').textContent='--';refresh();setTimeout(()=>inputs[0].focus(),50);
}
function percentileFor(total){const perfect=topFour().reduce((s,x)=>s+x.score,0),ratio=Math.max(0,Math.min(1,total/perfect));return Math.max(1,Math.min(99,Math.round(100-Math.pow(ratio,4.3)*100)))}
inputs.forEach((input,i)=>{
  input.addEventListener('input',()=>{
    const card=cards[i];
    card.classList.remove('precheck-invalid','precheck-ambiguous');
    card.querySelector('.meta').textContent='';
    refresh();
  });
  input.addEventListener('blur',()=>preValidate(i));
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      if(!preValidate(i)) return;
      if(i<inputs.length-1) inputs[i+1].focus();
      else document.getElementById('gameForm').requestSubmit();
    }
  });
});
document.getElementById('gameForm').addEventListener('submit',e=>{
  e.preventDefault();
  clearEntryFeedback();

  const filled=inputs.filter(i=>i.value.trim()).length;
  if(filled<4){
    const idx=inputs.findIndex(i=>!i.value.trim());
    showInputIssue(idx,'Add all four picks first');
    return;
  }

  const precheckFailed=inputs.some((_,i)=>!preValidate(i));
  if(precheckFailed) return;

  const resolved=inputs.map(i=>resolve(i.value));

  const badIndex=resolved.findIndex(r=>r.status!=='match');
  if(badIndex!==-1){
    const r=resolved[badIndex];
    if(r.status==='ambiguous'){
      showInputIssue(badIndex,'Be more specific: '+r.candidates.map(x=>x.name).join(' / '));
    }else{
      showInputIssue(badIndex,'Not ranked yet');
    }
    return;
  }

  const ids=resolved.map(r=>r.id);
  const duplicateIndex=ids.findIndex((id,i)=>ids.indexOf(id)!==i);
  if(duplicateIndex!==-1){
    showInputIssue(duplicateIndex,'Duplicate pick');
    return;
  }

  const rawTotal=resolved.reduce((sum,r)=>sum+r.score,0);
  const total=normalizedScore(rawTotal);

  // Canonicalize only after the player commits.
  resolved.forEach((r,i)=>{ inputs[i].value=r.name; });

  document.getElementById('liveScore').textContent=total.toFixed(1);
  document.getElementById('finalScore').textContent=total.toFixed(1);
  document.getElementById('percentile').textContent=`TOP ${percentileFor(rawTotal)}%`;

  document.getElementById('resultList').innerHTML=resolved.map((r,i)=>`
    <div class="result-item">
      <small>Pick ${i+1}</small>
      <strong>${r.name}</strong>
      <b>${Math.round(r.score*10)}%</b>
    </div>`).join('');

  let perfect=document.getElementById('perfectFour');
  if(!perfect){
    perfect=document.createElement('div');
    perfect.id='perfectFour';
    perfect.style.marginTop='14px';
    perfect.style.padding='16px';
    perfect.style.borderRadius='16px';
    perfect.style.background='rgba(255,255,255,.07)';
    document.getElementById('results').appendChild(perfect);
  }
  const best=topFour();
  perfect.innerHTML=`
    <small style="display:block;opacity:.55;font-weight:900;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px">
      Perfect Four · 40.0 / 40
    </small>
    <strong style="font-size:14px;line-height:1.5">${best.map(x=>x.name).join(' · ')}</strong>`;

  const nextBtn=document.getElementById('nextTopic');
  if(nextBtn){
    if(coreFourMode==='daily'){
      document.body.classList.add('daily-complete');
      nextBtn.textContent='RANDOM →';
      nextBtn.classList.add('random-cta');
    }else{
      nextBtn.textContent='NEXT TOPIC →';
      nextBtn.classList.remove('random-cta');
    }
  }
  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'nearest'});
});


let coreFourMode=null;

let lastPlayedTopicIndex=null;


function dailyTopicIndex(){
  const now=new Date();
  const key=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.floor(key/86400000)%topics.length;
}

function prepareTopic(){
  document.body.classList.remove('daily-complete');
  const nextBtn=document.getElementById('nextTopic');
  if(nextBtn){
    nextBtn.classList.remove('random-cta');
    nextBtn.textContent='NEXT TOPIC →';
  }
  setTopic();
  lastPlayedTopicIndex=topicIndex;
}

function chooseRandomTopic(excludeIndex=topicIndex){
  if(topics.length<=1){
    topicIndex=0;
    prepareTopic();
    return;
  }

  const choices=topics
    .map((_,i)=>i)
    .filter(i=>i!==excludeIndex);

  topicIndex=choices[Math.floor(Math.random()*choices.length)];
  prepareTopic();
}

function startMode(mode){
  coreFourMode=mode;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameApp').classList.remove('app-hidden');

  if(mode==='daily'){
    document.body.classList.add('daily-active');
    document.body.classList.remove('daily-complete');
    topicIndex=dailyTopicIndex();
    prepareTopic();
  }else{
    document.body.classList.remove('daily-active','daily-complete');
    topicIndex=Math.floor(Math.random()*topics.length);
    prepareTopic();
  }
  window.scrollTo({top:0});
}

document.getElementById('dailyBtn').addEventListener('click',()=>startMode('daily'));
document.getElementById('randomBtn').addEventListener('click',()=>startMode('random'));






window.coreFourHome = function(event){
  if(event){ event.preventDefault(); event.stopPropagation(); }

  coreFourMode = null;
  document.body.classList.remove('daily-active','daily-complete');

  const start = document.getElementById('startScreen');
  const app = document.getElementById('gameApp');
  const results = document.getElementById('results');

  if(results) results.classList.remove('show');
  if(app) app.classList.add('app-hidden');
  if(start) start.style.display = 'flex';

  inputs.forEach(input => input.value = '');
  document.getElementById('liveScore').textContent = '--';
  refresh();
  window.scrollTo({top:0, behavior:'smooth'});
};

window.coreFourNextTopic = function(event){
  if(event){ event.preventDefault(); event.stopPropagation(); }

  // Once this control is available, continuing always means Random mode.
  coreFourMode = 'random';
  document.body.classList.remove('daily-active','daily-complete');

  const oldIndex = topicIndex;
  if(topics.length > 1){
    const choices = topics.map((_, i) => i).filter(i => i !== oldIndex);
    topicIndex = choices[Math.floor(Math.random() * choices.length)];
  }

  // Reset the game explicitly instead of depending on multiple navigation helpers.
  const results = document.getElementById('results');
  if(results) results.classList.remove('show');

  const nextBtn = document.getElementById('nextTopic');
  if(nextBtn){
    nextBtn.textContent = 'NEXT TOPIC →';
    nextBtn.classList.remove('random-cta');
  }

  document.getElementById('topicTitle').textContent = current().title;
  inputs.forEach(input => input.value = '');
  document.getElementById('liveScore').textContent = '--';
  refresh();

  // Put the player back at the top of the game content.
  const game = document.getElementById('gameApp');
  if(game) game.scrollIntoView({behavior:'smooth', block:'start'});
  setTimeout(() => inputs[0].focus(), 250);
};
